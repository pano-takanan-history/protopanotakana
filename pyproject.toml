[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "protopanotakana"
version = "0.1"
dependencies = [
    "pylexibank>=3.5.0",
    "cldfbench==1.14.0",
    "pycldf==1.41.0",
    "csvw==3.5.1",
    "pyconcepticon==3.1.0",
]

[project.optional-dependencies]
test = ["pytest-cldf"]

[project.entry-points."lexibank.dataset"]
protopanotakana = "lexibank_protopanotakana:Dataset"

[tool.setuptools]
py-modules = ["protopanotakana"]
include-package-data = true
zip-safe = false
